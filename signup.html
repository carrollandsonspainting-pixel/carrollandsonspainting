<!DOCTYPE html>
<html>
<head>
    <title>Sign Up – Carroll & Sons</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://www.gstatic.com/firebasejs/11.5.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.5.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.5.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; 
            background: linear-gradient(135deg, #1a1a1a 0%, #2e7d32 100%);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .signup-box { 
            background: white; 
            padding: 2.5rem; 
            border-radius: 16px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.2); 
            width: 90%; 
            max-width: 400px; 
            border-top: 4px solid #f57c00; 
        }
        h1 { 
            color: #1a1a1a; 
            margin-bottom: 0.5rem; 
            font-size: 2rem; 
            text-align: center; 
        }
        h1 span { color: #f57c00; }
        h2 { 
            text-align: center; 
            margin-bottom: 2rem; 
            color: #4a5568; 
            font-weight: 500; 
            font-size: 1.2rem; 
        }
        input { 
            width: 100%; 
            padding: 1rem; 
            margin-bottom: 1rem; 
            border: 2px solid #e2e8f0; 
            border-radius: 8px; 
            font-size: 1rem; 
            transition: border-color 0.2s; 
        }
        input:focus { 
            outline: none; 
            border-color: #f57c00; 
        }
        button { 
            width: 100%; 
            padding: 1rem; 
            background: #f57c00; 
            color: black; 
            border: none; 
            border-radius: 8px; 
            font-size: 1.1rem; 
            font-weight: 600; 
            cursor: pointer; 
            transition: background 0.2s; 
            margin-top: 1rem; 
        }
        button:hover { 
            background: #2e7d32; 
            color: white; 
        }
        .error { 
            color: #e53e3e; 
            text-align: center; 
            margin-top: 1rem; 
            font-size: 0.9rem; 
        }
        .link { 
            text-align: center; 
            margin-top: 1.5rem; 
        }
        .link a { 
            color: #2e7d32; 
            text-decoration: none; 
            font-weight: 500; 
        }
        .link a:hover { 
            color: #f57c00; 
        }
        .back-link { 
            text-align: center; 
            margin-top: 1rem; 
        }
        .back-link a { 
            color: #718096; 
            text-decoration: none; 
            font-size: 0.9rem; 
        }
    </style>
</head>
<body>
    <div class="signup-box">
        <h1>CARROLL <span>& SONS</span></h1>
        <h2>Create Client Account</h2>
        
        <input type="text" id="name" placeholder="Full Name" required>
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="password" id="password" placeholder="Password (min 6 characters)" required>
        
        <button onclick="signup()">SIGN UP</button>
        
        <div class="error" id="error"></div>
        
        <div class="link">
            Already have an account? <a href="login.html">Log in</a>
        </div>
        <div class="back-link">
            <a href="index.html">← Back to Home</a>
        </div>
    </div>

    <script src="/carrollandsonspainting/js/firebase-config.js"></script>
    <script>
        function signup() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');

            // Clear previous errors
            errorDiv.textContent = '';

            // Validation
            if (!name || !email || !password) {
                errorDiv.textContent = 'Please fill all fields';
                return;
            }
            if (password.length < 6) {
                errorDiv.textContent = 'Password must be at least 6 characters';
                return;
            }

            // Show loading state
            const button = document.querySelector('button');
            button.textContent = 'Creating account...';
            button.disabled = true;

            // Create user in Firebase Authentication
            auth.createUserWithEmailAndPassword(email, password)
                .then(async (userCred) => {
                    // Update profile with display name
                    await userCred.user.updateProfile({ displayName: name });
                    
                    // ✅ CRITICAL: Create user document in Firestore
                    await db.collection('users').doc(userCred.user.uid).set({
                        name: name,
                        email: email,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    // Redirect based on email
                    if (email === "carrollandsonspainting@gmail.com") {
                        window.location.href = "admin.html";
                    } else {
                        window.location.href = "dashboard.html";
                    }
                })
                .catch(err => {
                    // Reset button
                    button.textContent = 'SIGN UP';
                    button.disabled = false;
                    
                    // Show friendly error messages
                    if (err.code === 'auth/email-already-in-use') {
                        errorDiv.textContent = 'This email is already registered. Please log in.';
                    } else if (err.code === 'auth/invalid-email') {
                        errorDiv.textContent = 'Please enter a valid email address.';
                    } else if (err.code === 'auth/weak-password') {
                        errorDiv.textContent = 'Password should be at least 6 characters.';
                    } else {
                        errorDiv.textContent = err.message;
                    }
                });
        }
    </script>
</body>
</html>
