<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel – Carroll & Sons</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <script src="https://www.gstatic.com/firebasejs/11.5.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.5.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.5.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f8f9fa; }
        .navbar { 
            background: #1a1a1a; 
            color: white; 
            padding: 0.75rem 1rem; 
            border-bottom: 3px solid #f57c00; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }
        .navbar .container { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            max-width: 1200px; 
            margin: 0 auto; 
            flex-wrap: wrap;
        }
        .logo h1 { 
            font-size: 1.2rem; 
            color: white; 
        }
        .logo span { color: #f57c00; }
        .user-info { 
            display: flex; 
            align-items: center; 
            gap: 0.5rem; 
            flex-wrap: wrap;
        }
        .user-info button { 
            background: #f57c00; 
            color: black; 
            border: none; 
            padding: 0.4rem 0.8rem; 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 0.9rem;
        }
        
        .notification-bell { 
            position: relative; 
            cursor: pointer; 
            font-size: 1.3rem; 
            margin-right: 0.5rem; 
        }
        .badge { 
            position: absolute; 
            top: -5px; 
            right: -5px; 
            background: red; 
            color: white; 
            border-radius: 50%; 
            padding: 2px 5px; 
            font-size: 0.7rem; 
            min-width: 16px; 
            text-align: center; 
        }
        .notification-panel { 
            position: fixed; 
            top: 70px; 
            right: 10px; 
            width: 90%; 
            max-width: 350px; 
            max-height: 70vh; 
            overflow-y: auto; 
            background: white; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
            display: none; 
            z-index: 1000; 
            border-left: 4px solid #f57c00; 
        }
        .notification-panel.show { display: block; }
        .notification-header { padding: 1rem; border-bottom: 1px solid #eee; font-weight: bold; display: flex; justify-content: space-between; }
        .notification-item { padding: 1rem; border-bottom: 1px solid #eee; }
        .notification-item.unread { background: #fff3e0; border-left: 3px solid #f57c00; }
        .notification-item small { color: #666; display: block; margin-top: 0.3rem; }
        .mark-read { background: #2e7d32; color: white; border: none; padding: 0.2rem 0.6rem; border-radius: 4px; cursor: pointer; font-size: 0.7rem; }
        
        .container { max-width: 1200px; margin: 1rem auto; padding: 0 1rem; }
        .grid { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 1.5rem; 
        }
        @media (min-width: 900px) {
            .grid { grid-template-columns: 1fr 1fr; }
        }
        
        .card { 
            background: white; 
            padding: 1rem; 
            border-radius: 12px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
            margin-bottom: 1rem; 
            border-left: 4px solid #f57c00; 
        }
        .card h2 { 
            font-size: 1.3rem; 
            margin-bottom: 1rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        
        .client-card, .project-card, .message { 
            background: #f1f3f5; 
            padding: 0.8rem; 
            border-radius: 8px; 
            margin-bottom: 0.8rem; 
            border-bottom: 2px solid #2e7d32; 
            word-wrap: break-word;
        }
        .client-card { display: flex; flex-direction: column; gap: 0.5rem; }
        @media (min-width: 600px) {
            .client-card { flex-direction: row; justify-content: space-between; align-items: center; }
        }
        .client-info { flex: 1; }
        .client-info h4 { font-size: 1rem; margin-bottom: 0.2rem; }
        .client-info p { font-size: 0.8rem; color: #555; }
        .delete-btn { 
            background: #dc3545; 
            color: white; 
            border: none; 
            padding: 0.4rem 0.8rem; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 0.8rem;
            align-self: flex-start;
        }
        
        .project-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
        .project-header h4 { font-size: 1rem; }
        
        .message-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
        .message-header strong { font-size: 0.9rem; }
        .message p { margin: 0.5rem 0; font-size: 0.95rem; }
        .message small { font-size: 0.7rem; color: #666; }
        
        .btn-create { 
            background: #f57c00; 
            color: black; 
            border: none; 
            padding: 0.5rem 1rem; 
            border-radius: 5px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 0.9rem;
        }
        input, textarea { 
            width: 100%; 
            padding: 0.5rem; 
            margin: 0.3rem 0; 
            border: 1px solid #ddd; 
            border-radius: 4px; 
            font-size: 0.95rem;
        }
        .reply-box { margin-top: 0.5rem; }
        .help-text { font-size:0.75rem; color:#666; margin-top: -0.2rem; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <h1>CARROLL <span>& SONS</span> | ADMIN</h1>
            </div>
            <div class="user-info">
                <div class="notification-bell" onclick="toggleNotifications()">
                    🔔
                    <span id="notificationBadge" class="badge" style="display: none;">0</span>
                </div>
                <span style="font-size:0.9rem;">Admin</span>
                <button onclick="logout()">LOGOUT</button>
            </div>
        </div>
    </nav>

    <div id="notificationPanel" class="notification-panel">
        <div class="notification-header">
            <span>Notifications</span>
            <button onclick="markAllRead()" style="background: none; color: #f57c00; padding: 0;">Mark all read</button>
        </div>
        <div id="notificationList"></div>
    </div>

    <div class="container">
        <div class="grid">
            <div>
                <div class="card">
                    <h2>All Clients</h2>
                    <div id="clients"></div>
                </div>
                <div class="card">
                    <h2>All Projects</h2>
                    <button class="btn-create" onclick="createProject()">+ New Project</button>
                    <div id="allProjects"></div>
                </div>
            </div>
            <div>
                <div class="card">
                    <h2>All Messages</h2>
                    <div id="allMessages"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/carrollandsonspainting/js/firebase-config.js"></script>
    <script>
        // ========== NOTIFICATION SYSTEM ==========
        let notificationPanelOpen = false;
        function toggleNotifications() {
            const panel = document.getElementById('notificationPanel');
            notificationPanelOpen = !notificationPanelOpen;
            panel.classList.toggle('show', notificationPanelOpen);
        }

        async function loadNotifications() {
            const snapshot = await db.collection('notifications')
                .where('read', '==', false)
                .orderBy('timestamp', 'desc')
                .limit(20)
                .get();
            const badge = document.getElementById('notificationBadge');
            const list = document.getElementById('notificationList');
            if (!snapshot.empty) {
                badge.style.display = 'inline';
                badge.textContent = snapshot.size;
                list.innerHTML = '';
                snapshot.forEach(doc => {
                    const n = doc.data();
                    const timestamp = n.timestamp ? new Date(n.timestamp.seconds * 1000).toLocaleString() : 'Just now';
                    list.innerHTML += `
                        <div class="notification-item unread" data-id="${doc.id}">
                            <strong>📸 New Photo Upload</strong>
                            <p>${n.clientName || 'A client'} uploaded: ${n.fileName}</p>
                            <a href="${n.fileUrl}" target="_blank">View photo</a>
                            <small>${timestamp}</small>
                            <button class="mark-read" onclick="markNotificationRead('${doc.id}')">Mark Read</button>
                        </div>
                    `;
                });
            } else {
                badge.style.display = 'none';
                list.innerHTML = '<div class="notification-item">No new notifications</div>';
            }
        }

        async function markNotificationRead(id) {
            await db.collection('notifications').doc(id).update({ read: true });
            loadNotifications();
        }

        async function markAllRead() {
            const snapshot = await db.collection('notifications').where('read', '==', false).get();
            const batch = db.batch();
            snapshot.forEach(doc => batch.update(doc.ref, { read: true }));
            await batch.commit();
            loadNotifications();
        }

        // ========== LOGOUT ==========
        window.logout = function() {
            auth.signOut().then(() => window.location.href = "index.html");
        };

        // ========== LOAD ALL CLIENTS ==========
        async function loadAllClients() {
            const usersSnap = await db.collection('users').get();
            const clientsDiv = document.getElementById('clients');
            clientsDiv.innerHTML = '';
            if (usersSnap.empty) {
                clientsDiv.innerHTML = '<p>No clients yet.</p>';
                return;
            }
            usersSnap.forEach(doc => {
                const user = doc.data();
                const userId = doc.id;
                const isAdmin = (user.email === 'carrollandsonspainting@gmail.com');
                clientsDiv.innerHTML += `
                    <div class="client-card" data-id="${userId}">
                        <div class="client-info">
                            <h4>${user.name}</h4>
                            <p>Email: ${user.email}</p>
                            <p>ID: ${userId.substring(0,8)}…</p>
                        </div>
                        ${!isAdmin ? `<button class="delete-btn" onclick="deleteClient('${userId}', '${user.name}')">DELETE</button>` : ''}
                    </div>
                `;
            });
        }

        window.deleteClient = async function(clientId, clientName) {
            if (!confirm(`Delete ${clientName} and ALL their projects and messages?`)) return;
            try {
                const batch = db.batch();
                const messagesSnap = await db.collection('messages').where('clientId', '==', clientId).get();
                messagesSnap.forEach(doc => batch.delete(doc.ref));
                const projectsSnap = await db.collection('projects').where('clientId', '==', clientId).get();
                projectsSnap.forEach(doc => batch.delete(doc.ref));
                batch.delete(db.collection('users').doc(clientId));
                await batch.commit();
                alert('Client deleted');
                loadAllClients(); loadAllProjects(); loadAllMessages();
            } catch (error) {
                console.error(error);
                alert('Error deleting client');
            }
        };

        // ========== LOAD ALL PROJECTS ==========
        async function loadAllProjects() {
            const projectsSnap = await db.collection('projects').orderBy('createdAt', 'desc').get();
            const projectsDiv = document.getElementById('allProjects');
            projectsDiv.innerHTML = '';
            if (projectsSnap.empty) {
                projectsDiv.innerHTML = '<p>No projects yet.</p>';
                return;
            }
            const today = new Date().toISOString().split('T')[0];
            projectsSnap.forEach(doc => {
                const p = doc.data();
                const projectId = doc.id;
                const nextUpdate = p.nextUpdate || '';
                projectsDiv.innerHTML += `
                    <div class="project-card">
                        <div class="project-header">
                            <h4>${p.name}</h4>
                            <button class="delete-btn" onclick="deleteProject('${projectId}')">DELETE</button>
                        </div>
                        <p>Client ID: ${p.clientId.substring(0,8)}…</p>
                        <p>Status: <input type="text" value="${p.status || 'New'}" onchange="updateStatus('${projectId}', this.value)"></p>
                        <p>Next update: <input type="date" value="${nextUpdate}" min="${today}" onchange="updateNextUpdate('${projectId}', this.value)"></p>
                        <p class="help-text">Leave blank if no update scheduled</p>
                    </div>
                `;
            });
        }

        window.deleteProject = async function(projectId) {
            if (!confirm('Delete this project?')) return;
            try {
                await db.collection('projects').doc(projectId).delete();
                alert('Project deleted');
                loadAllProjects();
            } catch (error) {
                console.error(error);
                alert('Error deleting project');
            }
        };

        window.updateStatus = async function(projectId, newStatus) {
            await db.collection('projects').doc(projectId).update({ status: newStatus });
            alert('Status updated');
        };

        window.updateNextUpdate = async function(projectId, date) {
            const value = date || '';
            await db.collection('projects').doc(projectId).update({ nextUpdate: value });
            const input = event.target;
            if (input) {
                input.style.backgroundColor = '#d4edda';
                setTimeout(() => input.style.backgroundColor = '', 300);
            }
        };

        // ========== REAL-TIME MESSAGES (LIVE UPDATES) ==========
        let unsubscribeMessages = null;

        function setupMessagesListener() {
            if (unsubscribeMessages) unsubscribeMessages();
            unsubscribeMessages = db.collection('messages')
                .orderBy('timestamp', 'desc')
                .onSnapshot(snapshot => {
                    const msgsDiv = document.getElementById('allMessages');
                    msgsDiv.innerHTML = '';
                    if (snapshot.empty) {
                        msgsDiv.innerHTML = '<p>No messages yet.</p>';
                        return;
                    }
                    snapshot.forEach(doc => {
                        const m = doc.data();
                        const msgId = doc.id;
                        const timestamp = m.timestamp ? new Date(m.timestamp.toDate()).toLocaleString() : 'Just now';
                        msgsDiv.innerHTML += `
                            <div class="message" id="msg-${msgId}">
                                <div class="message-header">
                                    <strong>${m.clientName || 'Client'}:</strong>
                                    <button class="delete-btn" onclick="deleteMessage('${msgId}')">DELETE</button>
                                </div>
                                <p>${m.text}</p>
                                <small>${timestamp}</small>
                                <div class="reply-box">
                                    <textarea id="reply-${msgId}" placeholder="Type reply..." rows="2"></textarea>
                                    <button onclick="sendReply('${msgId}', '${m.clientId}')">Send Reply</button>
                                </div>
                            </div>
                        `;
                    });
                }, error => {
                    console.error("Messages listener error:", error);
                });
        }

        window.deleteMessage = async function(messageId) {
            if (!confirm('Delete this message?')) return;
            try {
                await db.collection('messages').doc(messageId).delete();
                alert('Message deleted');
                // Listener updates automatically
            } catch (error) {
                console.error(error);
                alert('Error deleting message');
            }
        };

        window.sendReply = async function(messageId, clientId) {
            const replyText = document.getElementById(`reply-${messageId}`).value;
            if (!replyText.trim()) return;
            await db.collection('messages').add({
                clientId: clientId,
                text: replyText,
                from: 'admin',
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                read: false
            });
            document.getElementById(`reply-${messageId}`).value = '';
            alert('Reply sent');
            // Listener updates automatically
        };

        // ========== CREATE NEW PROJECT ==========
        window.createProject = async function() {
            const clientId = prompt('Enter client UID (from All Clients section):');
            if (!clientId) return;
            const name = prompt('Project name:');
            if (!name) return;
            try {
                await db.collection('projects').add({
                    clientId: clientId,
                    name: name,
                    status: 'New',
                    nextUpdate: '',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                loadAllProjects();
            } catch (error) {
                console.error(error);
                alert('Error creating project');
            }
        };

        // ========== AUTH STATE ==========
        auth.onAuthStateChanged(user => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            if (user.email !== 'carrollandsonspainting@gmail.com') {
                window.location.href = 'dashboard.html';
                return;
            }
            loadAllClients();
            loadAllProjects();
            loadNotifications();
            setupMessagesListener();   // <-- real-time messages
            setInterval(loadNotifications, 10000);
        });

        // Close notification panel
        document.addEventListener('click', function(event) {
            const panel = document.getElementById('notificationPanel');
            const bell = document.querySelector('.notification-bell');
            if (notificationPanelOpen && panel && bell && !panel.contains(event.target) && !bell.contains(event.target)) {
                panel.classList.remove('show');
                notificationPanelOpen = false;
            }
        });
    </script>
</body>
</html>
