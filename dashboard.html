<!DOCTYPE html>
<html>
<head>
    <title>Client Dashboard – Carroll & Sons</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <script src="https://www.gstatic.com/firebasejs/11.5.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.5.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.5.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f8f9fa; }
        .navbar { background: #1a1a1a; color: white; padding: 0.75rem 1rem; border-bottom: 3px solid #f57c00; }
        .navbar .container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
        .logo h1 { font-size: 1.2rem; color: white; }
        .logo span { color: #f57c00; }
        .user-info { display: flex; align-items: center; gap: 0.5rem; }
        .user-info button { background: #f57c00; color: black; border: none; padding: 0.4rem 0.8rem; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        .container { max-width: 1200px; margin: 1rem auto; padding: 0 1rem; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
        @media (min-width: 800px) { .grid { grid-template-columns: 2fr 1fr; } }
        .card { background: white; padding: 1rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 1rem; border-left: 4px solid #f57c00; }
        .card h2 { font-size: 1.3rem; margin-bottom: 1rem; }
        .project-card { background: #f1f3f5; padding: 0.8rem; border-radius: 8px; margin-bottom: 0.8rem; border-bottom: 2px solid #2e7d32; }
        .message { background: #f1f3f5; padding: 0.8rem; border-radius: 8px; margin-bottom: 0.8rem; border-left: 3px solid #2e7d32; }
        .message.admin { border-left-color: #f57c00; background: #fff3e0; }
        .message-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
        .delete-msg-btn { background: #dc3545; color: white; border: none; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.7rem; cursor: pointer; }
        .message small { font-size: 0.7rem; color: #666; display: block; margin-top: 0.3rem; }
        .upload-btn { display: inline-block; background: #f57c00; color: black; padding: 0.6rem 1.2rem; border-radius: 50px; text-decoration: none; font-weight: bold; margin-top: 0.5rem; text-align: center; width: 100%; max-width: 300px; }
        textarea { width: 100%; padding: 0.6rem; border: 2px solid #e2e8f0; border-radius: 8px; font-family: inherit; margin: 0.5rem 0; }
        .btn { background: #f57c00; color: black; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
        .empty-state { color: #718096; text-align: center; padding: 1rem; font-style: italic; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <h1>CARROLL <span>& SONS</span> | CLIENT PORTAL</h1>
            </div>
            <div class="user-info">
                <span id="userName"></span>
                <button onclick="logout()">LOGOUT</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="grid">
            <div>
                <div class="card">
                    <h2>My Projects</h2>
                    <div id="projects"></div>
                </div>
                <div class="card">
                    <h2>📤 Upload Progress Photos</h2>
                    <p>Include your name and project in the file name.</p>
                    <a href="https://drive.google.com/drive/folders/1Bx_-RXcUtN4GuJyfjQXitKTG7qXQk1vO?usp=drive_link" target="_blank" class="upload-btn">📁 OPEN UPLOAD FOLDER</a>
                </div>
            </div>
            <div>
                <div class="card">
                    <h2>Messages</h2>
                    <div id="messages"></div>
                    <textarea id="messageInput" placeholder="Type a message..." rows="3"></textarea>
                    <button class="btn" onclick="sendMessage()">Send Message</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/carrollandsonspainting/js/firebase-config.js"></script>
    <script>
        let unsubscribeMessages = null;

        window.logout = () => auth.signOut().then(() => window.location.href = "index.html");

        function loadProjects() {
            const user = auth.currentUser;
            if (!user) return;
            db.collection('projects').where('clientId', '==', user.uid).get().then(snapshot => {
                const div = document.getElementById('projects');
                div.innerHTML = '';
                if (snapshot.empty) {
                    div.innerHTML = '<div class="empty-state">No active projects yet.</div>';
                } else {
                    snapshot.forEach(doc => {
                        const p = doc.data();
                        div.innerHTML += `
                            <div class="project-card">
                                <h3>${p.name}</h3>
                                <p><strong>Status:</strong> ${p.status || 'In Progress'}</p>
                                <p><strong>Next update:</strong> ${p.nextUpdate || 'Check back soon'}</p>
                            </div>
                        `;
                    });
                }
            });
        }

        function setupMessagesListener() {
            const user = auth.currentUser;
            if (!user) return;
            if (unsubscribeMessages) unsubscribeMessages();
            unsubscribeMessages = db.collection('messages')
                .where('clientId', '==', user.uid)
                .orderBy('timestamp', 'asc')
                .onSnapshot(snapshot => {
                    const div = document.getElementById('messages');
                    div.innerHTML = '';
                    if (snapshot.empty) {
                        div.innerHTML = '<div class="empty-state">No messages yet.</div>';
                    } else {
                        snapshot.forEach(doc => {
                            const m = doc.data();
                            const msgId = doc.id;
                            const isAdmin = m.from === 'admin';
                            const time = m.timestamp ? new Date(m.timestamp.toDate()).toLocaleString() : 'Just sent';
                            div.innerHTML += `
                                <div class="message ${isAdmin ? 'admin' : ''}">
                                    <div class="message-header">
                                        <strong>${isAdmin ? '🏢 Carroll & Sons' : '👤 You'}:</strong>
                                        ${!isAdmin ? `<button class="delete-msg-btn" onclick="deleteMessage('${msgId}')">DELETE</button>` : ''}
                                    </div>
                                    <p>${m.text}</p>
                                    <small>${time}</small>
                                </div>
                            `;
                        });
                    }
                }, error => console.error("Message listener error:", error));
        }

        window.deleteMessage = async (id) => {
            if (!confirm('Delete this message?')) return;
            try {
                await db.collection('messages').doc(id).delete();
            } catch (err) {
                alert('Error deleting message');
                console.error(err);
            }
        };

        window.sendMessage = async () => {
            const user = auth.currentUser;
            const text = document.getElementById('messageInput').value.trim();
            if (!text) return alert('Please enter a message');
            const btn = document.querySelector('.btn');
            btn.disabled = true;
            btn.textContent = 'Sending...';
            try {
                await db.collection('messages').add({
                    clientId: user.uid,
                    clientName: user.displayName,
                    text: text,
                    from: 'client',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    read: false
                });
                document.getElementById('messageInput').value = '';
            } catch (err) {
                alert('Error sending message');
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send Message';
            }
        };

        auth.onAuthStateChanged(user => {
            if (!user) return window.location.href = 'login.html';
            if (user.email === 'carrollandsonspainting@gmail.com') return window.location.href = 'admin.html';
            document.getElementById('userName').textContent = user.displayName || user.email;
            loadProjects();
            setupMessagesListener();
        });
    </script>
</body>
</html>
